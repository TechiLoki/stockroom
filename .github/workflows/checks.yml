name: Import reliability tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Compile and test CSV, XLSX, validation and API
        run: docker compose build api
      - name: Start database and API
        run: docker compose up -d --wait db rest api
      - name: Check database transactions and idempotency
        run: docker compose exec -T db psql -U postgres -d stockroom -v ON_ERROR_STOP=1 < tests/database.sql
      - name: Start worker
        run: docker compose up -d worker
      - name: Run real import workflow
        run: docker compose exec -T api node scripts/smoke.mjs
      - name: Print logs
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop stack
        if: always()
        run: docker compose down
